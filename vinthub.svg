<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for a modern, sleek depth -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    
    <!-- Neon glow effect for the intelligence 'blip' -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(15, 5)">
    <!-- Outer Cyber Shield Base -->
    <path d="M 40 5 L 75 20 L 75 50 C 75 75 40 90 40 90 C 40 90 5 75 5 50 L 5 20 Z" 
          fill="#0B1120" 
          stroke="url(#shieldGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>

    <!-- Subtle Radar/Grid lines inside shield -->
    <path d="M 40 5 L 40 90 M 5 20 L 75 20 M 5 50 L 75 50" 
          fill="none" 
          stroke="#1E293B" 
          stroke-width="1" 
          stroke-dasharray="3 3"/>

    <!-- Central 'V' Data Structure -->
    <path d="M 22 35 L 40 65 L 58 35" 
          fill="none" 
          stroke="url(#vGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Threat/Intelligence Alert Node -->
    <circle cx="58" cy="35" r="5" fill="url(#alertGrad)" filter="url(#neonGlow)"/>

    <!-- Geometric Nodes -->
    <circle cx="40" cy="65" r="3.5" fill="#60A5FA"/>
    <circle cx="22" cy="35" r="3.5" fill="#60A5FA"/>
    
    <!-- Shield Anchor Points -->
    <circle cx="40" cy="5" r="2" fill="#3B82F6"/>
    <circle cx="75" cy="20" r="2" fill="#3B82F6"/>
    <circle cx="5" cy="20" r="2" fill="#3B82F6"/>
    <circle cx="40" cy="90" r="2" fill="#3B82F6"/>
  </g>

</svg>
